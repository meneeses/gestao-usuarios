<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Gestão de Usuários</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <h2>Gestão de Usuários</h2>
        <div style="display: flex; align-items: center; gap: 1rem;">
            <span id="header-user-info"></span>
            <button id="btn-logout" class="btn btn-outline btn-sm">Sair</button>
        </div>
    </nav>

    <div class="container">
        <!-- Section 1: User Profile -->
        <div class="card" id="section-profile">
            <h3>Meu Perfil</h3>
            <div id="profile-info" class="mt-1 mb-1"></div>
            <button id="btn-edit-profile" class="btn btn-primary btn-sm">Editar Meus Dados</button>
        </div>

        <!-- Section 2: Users Table -->
        <div class="card" id="section-users">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                <h3>Usuários Cadastrados</h3>
                <button id="btn-new-user" class="btn btn-success btn-sm hidden">Novo Usuário</button>
            </div>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nome</th>
                            <th>E-mail</th>
                            <th>Perfil</th>
                            <th>Criado em</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="users-table-body">
                    </tbody>
                </table>
            </div>
            <p id="empty-state" class="text-center mt-2 hidden" style="color: #64748b;">Nenhum usuário encontrado.</p>
        </div>

        <!-- Section 3: API Console -->
        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                <h3>Console da API</h3>
                <button id="btn-clear-console" class="btn btn-outline btn-sm">Limpar</button>
            </div>
            <div id="api-console" class="api-console"></div>
        </div>
    </div>

    <!-- Modal Form -->
    <div id="modal-form" class="modal-overlay hidden">
        <div class="modal-content">
            <h3 id="modal-title" class="mb-2">Novo Usuário</h3>
            <div id="modal-alert" class="alert hidden"></div>
            <form id="user-form">
                <input type="hidden" id="user-id">
                <div class="form-group">
                    <label>Nome</label>
                    <input type="text" id="user-nome" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>E-mail</label>
                    <input type="email" id="user-email" class="form-control" required>
                </div>
                <div class="form-group" id="group-senha">
                    <label>Senha</label>
                    <input type="password" id="user-senha" class="form-control">
                </div>
                <div class="form-group" id="group-perfil">
                    <label>Perfil</label>
                    <select id="user-perfil" class="form-control">
                        <option value="administrador">Administrador</option>
                        <option value="operador">Operador</option>
                        <option value="cliente">Cliente</option>
                    </select>
                </div>
                <div style="display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 1.5rem;">
                    <button type="button" id="btn-cancel" class="btn btn-outline">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
